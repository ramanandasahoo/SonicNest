
name: Build SonicNest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Android manifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("app/src/main/AndroidManifest.xml")
          print("Manifest path:", path.resolve())
          print("Manifest exists:", path.exists())

          data = path.read_bytes()
          print("First 20 bytes:", repr(data[:20]))

          try:
              ET.fromstring(data)
              print("XML validation: PASSED")
          except ET.ParseError as exc:
              print("XML validation: FAILED")
              print("Exact parser error:", exc)
              raise
          PY

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicNest-debug-apk
          path: app/build/outputs/apk/debug/*.apk
